name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            cpu: ''
            name: linux-x86_64
          - os: windows-latest
            arch: x86_64
            cpu: ''
            name: windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cl main.c anyascii.c /Fe:slugify.exe
          else
            gcc main.c anyascii.c -o slugify
          fi
        shell: bash

      - name: Rename binary
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mv slugify.exe slugify-${{ matrix.name }}.exe
          else
            mv slugify slugify-${{ matrix.name }}
          fi
        shell: bash

      - name: Upload binary
        uses: softprops/action-gh-release@v1
        with:
          files: slugify-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}