name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86
            compiler: gcc -m32
            name: linux-x86
          - os: ubuntu-latest
            arch: x64
            compiler: gcc
            name: linux-x64
          - os: ubuntu-latest
            arch: armv7
            compiler: arm-linux-gnueabihf-gcc -static
            name: linux-armv7
          - os: ubuntu-latest
            arch: arm64
            compiler: aarch64-linux-gnu-gcc -static
            name: linux-arm64
          - os: windows-latest
            arch: x64
            compiler: cl
            name: windows-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install 32-bit development libraries (Linux x86)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386

      - name: Install cross-compilers (Linux)
        if: matrix.os == 'ubuntu-latest' && (matrix.arch == 'armv7' || matrix.arch == 'arm64')
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cl /utf-8 main.c anyascii.c /Fe:slugify.exe
          else
            ${{ matrix.compiler }} main.c anyascii.c -o slugify
          fi
        shell: bash

      - name: Rename binary
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mv slugify.exe slugify-${{ matrix.name }}.exe
          else
            mv slugify slugify-${{ matrix.name }}
          fi
        shell: bash

      - name: Upload binary
        uses: softprops/action-gh-release@v1
        with:
          files: slugify-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}