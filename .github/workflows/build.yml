name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: gcc main.c anyascii.c -o slugify
        shell: bash

      - name: Rename binary
        run: mv slugify slugify-linux-x64
        shell: bash

      - name: Upload binary
        uses: softprops/action-gh-release@v1
        with:
          files: slugify-linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  build-linux-x86:
    runs-on: ubuntu-latest
    needs: build-linux-x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install 32-bit development libraries (Linux x86)
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386

      - name: Build
        run: gcc -m32 main.c anyascii.c -o slugify
        shell: bash

      - name: Rename binary
        run: mv slugify slugify-linux-x86
        shell: bash

      - name: Upload binary
        uses: softprops/action-gh-release@v1
        with:
          files: slugify-linux-x86
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross-compilers (Linux)
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: aarch64-linux-gnu-gcc -static main.c anyascii.c -o slugify
        shell: bash

      - name: Rename binary
        run: mv slugify slugify-linux-arm64
        shell: bash

      - name: Upload binary
        uses: softprops/action-gh-release@v1
        with:
          files: slugify-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-armv7:
    runs-on: ubuntu-latest
    needs: build-linux-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross-compilers (Linux)
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Build
        run: arm-linux-gnueabihf-gcc -static main.c anyascii.c -o slugify
        shell: bash

      - name: Rename binary
        run: mv slugify slugify-linux-armv7
        shell: bash

      - name: Upload binary
        uses: softprops/action-gh-release@v1
        with:
          files: slugify-linux-armv7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2

      - name: Build
        run: nim c --cpu:amd64 --os:windows --passC:-fpermissive --app:console slugify.nim
        shell: bash

      - name: Rename binary
        run: mv slugify.exe slugify-windows-x64.exe
        shell: bash

      - name: Upload binary
        uses: softprops/action-gh-release@v1
        with:
          files: slugify-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-x86:
    runs-on: windows-latest
    needs: build-windows-x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2

      - name: Build
        run: nim c --cpu:i386 --os:windows --passC:-fpermissive --passC:-m32 --app:console slugify.nim
        shell: bash

      - name: Rename binary
        run: mv slugify.exe slugify-windows-x86.exe
        shell: bash

      - name: Upload binary
        uses: softprops/action-gh-release@v1
        with:
          files: slugify-windows-x86.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
